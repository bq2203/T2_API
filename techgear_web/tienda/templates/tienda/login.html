{% extends "tienda/base.html" %}
{% block titulo %}Iniciar sesión · TechGear{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-4 text-center">Iniciar sesión</h1>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" value="{{ email }}" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="text-center text-body-secondary small mt-3 mb-0">
          ¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
