{% if estado == "pendiente" %}<span class="badge rounded-pill text-bg-warning"><i class="bi bi-hourglass-split me-1"></i>Pendiente</span>{% elif estado == "enviado" %}<span class="badge rounded-pill text-bg-info"><i class="bi bi-truck me-1"></i>Enviado</span>{% elif estado == "entregado" %}<span class="badge rounded-pill text-bg-success"><i class="bi bi-check-circle-fill me-1"></i>Entregado</span>{% elif estado == "cancelado" %}<span class="badge rounded-pill text-bg-danger"><i class="bi bi-x-circle-fill me-1"></i>Cancelado</span>{% else %}<span class="badge rounded-pill text-bg-secondary">{{ estado|capfirst }}</span>{% endif %}
