{% extends "tienda/base.html" %}
{% block titulo %}Mi perfil · TechGear{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header bg-body"><h1 class="h4 mb-0">Mi perfil</h1></div>
      <div class="card-body">
        <dl class="row mb-0">
          <dt class="col-sm-3">Nombre</dt><dd class="col-sm-9">{{ perfil.nombre }}</dd>
          <dt class="col-sm-3">Email</dt><dd class="col-sm-9">{{ perfil.email }}</dd>
          <dt class="col-sm-3">Rol</dt>
          <dd class="col-sm-9">
            <span class="badge {% if perfil.rol == 'admin' %}text-bg-primary{% else %}text-bg-secondary{% endif %}">{{ perfil.rol }}</span>
          </dd>
          <dt class="col-sm-3">ID</dt><dd class="col-sm-9 text-break"><code>{{ perfil.id }}</code></dd>
        </dl>
      </div>
      <div class="card-footer bg-body text-body-secondary small">
        Datos obtenidos de la API con tu JWT (<code>GET /usuarios/me</code>).
      </div>
    </div>
  </div>
</div>
{% endblock %}
