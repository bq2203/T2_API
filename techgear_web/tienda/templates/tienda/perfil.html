{% extends "tienda/base.html" %}
{% block titulo %}Mi perfil · TechGear{% endblock %}
{% block contenido %}
<section class="formulario">
  <h1>Mi perfil</h1>
  <dl class="datos">
    <dt>Nombre</dt><dd>{{ perfil.nombre }}</dd>
    <dt>Email</dt><dd>{{ perfil.email }}</dd>
    <dt>ID</dt><dd><code>{{ perfil.id }}</code></dd>
  </dl>
  <p class="formulario__alt">Datos obtenidos de la API con tu JWT (<code>GET /usuarios/me</code>).</p>
</section>
{% endblock %}
