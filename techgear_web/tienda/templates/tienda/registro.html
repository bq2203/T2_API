{% extends "tienda/base.html" %}
{% block titulo %}Crear cuenta · TechGear{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
    <div class="tg-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="tg-icon-box tg-icon-box-lg mx-auto mb-3"><i class="bi bi-person-plus"></i></div>
        <h1 class="h4 mb-1">Crea tu cuenta</h1>
        <p class="text-body-secondary small mb-0">Con una cuenta puedes comprar y seguir tus pedidos.</p>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="nombre" id="nombre" class="form-control" value="{{ nombre }}"
                   minlength="2" autocomplete="name" required autofocus>
          </div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" id="email" class="form-control" value="{{ email }}"
                   placeholder="tu@correo.com" autocomplete="email" required>
          </div>
        </div>
        <div class="row g-3 mb-4">
          <div class="col-12 col-sm-6">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" id="password" class="form-control"
                     minlength="6" maxlength="72" autocomplete="new-password" required>
              <button type="button" class="btn btn-outline-secondary" data-toggle-pass="#password" aria-label="Mostrar u ocultar contraseña">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="form-text">Mínimo 6 caracteres.</div>
          </div>
          <div class="col-12 col-sm-6">
            <label for="password2" class="form-label">Repite la contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" name="password2" id="password2" class="form-control"
                     minlength="6" maxlength="72" autocomplete="new-password" required>
              <button type="button" class="btn btn-outline-secondary" data-toggle-pass="#password2" aria-label="Mostrar u ocultar contraseña">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-person-check me-2"></i>Crear cuenta</button>
      </form>

      <p class="text-center small text-body-secondary mt-4 mb-0">
        ¿Ya tienes cuenta? <a href="{% url 'login' %}" class="fw-semibold">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
